<script>
window.addEventListener('DOMContentLoaded',()=>{
 const video=document.getElementById('moonlight-reel');
 const menu=document.querySelector('.site-menu');
 const lists=document.querySelector('.lists-popover');
 let entered=false;
 const enterSite=()=>{
  if(entered)return; entered=true;
  document.body.classList.remove('intro-active');
  video.loop=true;
  if(video.ended||video.currentTime>=video.duration){video.currentTime=0;}
  video.play().catch(()=>{});
 };

 video.addEventListener('ended',()=>{video.currentTime=0;enterSite()});
 video.addEventListener('error',enterSite,{once:true});
 video.muted=false;
 video.volume=1;
 video.play().catch(()=>{
   // If autoplay with sound is blocked, retain the intro and retry on the first user gesture.
   const resumeWithAudio=()=>{video.muted=false;video.volume=1;video.play().catch(()=>{});};
   document.addEventListener("pointerdown",resumeWithAudio,{once:true});
   document.addEventListener("keydown",resumeWithAudio,{once:true});
 });
 document.addEventListener('click',e=>{
  if(menu&&!menu.contains(e.target))menu.open=false;
  if(lists&&!lists.contains(e.target))lists.open=false;
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(menu)menu.open=false;if(lists)lists.open=false;}
 });
 document.querySelectorAll('.menu-panel a[href^="#"]').forEach(a=>a.addEventListener('click',()=>{if(menu)menu.open=false}));
 document.querySelectorAll('.lists-popover-panel a').forEach(a=>a.addEventListener('click',()=>{if(lists)lists.open=false}));
});
</script>

.bwayne-feature h2{font-size:clamp(24px,3.3vw,36px);line-height:1.02;letter-spacing:-.04em;margin:8px 0 9px}
.bwayne-feature .kicker{font-size:9px;letter-spacing:.19em;color:#d6b86c}
.bwayne-feature p:not(.kicker){max-width:440px;font-size:12px;line-height:1.65;color:#c5bdac;margin:0}
.bwayne-feature .btn{font-size:9px;padding:11px 15px;white-space:nowrap;box-shadow:none}
.foot{margin-top:54px;padding:20px 0 24px;gap:16px;font-size:8px;letter-spacing:.1em;align-items:center}
.verdant-footer-logo{width:96px;height:auto;max-height:56px;object-fit:contain;flex:0 0 auto}
.foot span{line-height:1.6}
@media(min-width:601px){.foot{flex-direction:row}.bwayne-feature{min-height:0}}
@media(max-width:600px){
 .opening video{width:100vw;height:100vh;height:100dvh;object-fit:contain}
 .bwayne-feature{margin:22px auto 38px;padding:21px;gap:12px;align-items:flex-start}
 .bwayne-feature h2{font-size:27px;margin:6px 0 8px}
 .bwayne-feature p:not(.kicker){font-size:12px;max-width:100%}
 .bwayne-feature .btn{font-size:8px;padding:10px 13px}
 .foot{margin-top:38px;padding:18px 0 22px;gap:12px;align-items:center;text-align:center}
 .verdant-footer-logo{width:82px;max-height:48px;margin:0 auto 2px}
}
@media(prefers-reduced-motion:reduce){.opening{animation-duration:.01ms;animation-delay:2.5s}}
