const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.style.display='none',3300)}
function call(name,args,done){const runner=google.script.run.withSuccessHandler(done).withFailureHandler(e=>{toast(e&&e.message?e.message:'Falha ao falar com a central');document.querySelectorAll('[data-busy]').forEach(x=>x.disabled=false)});runner[name](...(args||[]))}
function refresh(keep=true){call('getCentralAppData',[],d=>{appData=d; if(!keep||!selectedDate)selectedDate=(d.events.find(e=>e.date)?.date)||''; render()})}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">GESTÃO · OPERAÇÃO · COMUNIDADE</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="head-actions">${action}</div></div>`}
function eventOptions(){return (appData?.events||[]).filter(e=>e.date).map(e=>`<option value="${esc(e.date)}" ${selectedDate===e.date?'selected':''}>${esc(e.name||e.day)} · ${fmt(e.date)}</option>`).join('')||'<option value="">Cadastre um evento primeiro</option>'}
function fmt(iso){if(!iso)return 'Data não definida';const p=String(iso).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso}
function isOpen(e){return String(e.status||'Ativo').toLowerCase()==='ativo'}
function stat(label,value,foot,accent,wash,icon){return `<article class="stat" style="--wash:${wash};--accent:${accent}"><div class="stat-head"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${value}</div><div class="stat-foot">${foot}</div></article>`}
function miniCalendar(events){const anchor=events.find(e=>e.date)?.date;const d=anchor?new Date(anchor+'T12:00:00'):new Date();const year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate();let cells='';for(let i=0;i<42;i++){let n=i-first+1,dt,current=true;if(n<1){dt=new Date(year,month-1,prev+n);current=false}else if(n>days){dt=new Date(year,month+1,n-days);current=false}else dt=new Date(year,month,n);const iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;const ev=events.find(x=>x.date===iso);cells+=`<span class="cal-day${current?'':' dim'}${ev?(ev.day==='Sexta-feira'?' friday':' saturday'):''}">${dt.getDate()}${ev?'<i></i>':''}</span>`}const monthName=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(year,month,1));const keys=events.filter(e=>e.date).map(e=>`<span><i class="${e.day==='Sexta-feira'?'dot-friday':'dot-saturday'}"></i> ${esc(e.day==='Sexta-feira'?'Sexta':'Sábado')} · ${fmt(e.date).slice(0,5)}</span>`).join('');return `<div class="card-sub">${esc(monthName)}</div><div class="mini-calendar"><div class="calendar-week">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-days">${cells}</div></div><div class="calendar-key">${keys||'<span>Nenhum evento cadastrado</span>'}</div>`}
const icons={people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.2A4.8 4.8 0 0 1 8.3 13h1.4a4.8 4.8 0 0 1 4.8 4.8V19M16 5.5a3 3 0 0 1 0 5.8M17 13.2a4.6 4.6 0 0 1 3.5 4.5V19"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 10-8.8 10s-8.8-4.9-8.8-10A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></svg>',dj:'<svg viewBox="0 0 24 24"><path d="M3.5 13v-1a8.5 8.5 0 0 1 17 0v1M4 12h2.5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6Zm16 0h-2.5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2H18a2 2 0 0 0 2-2v-6Z"/></svg>',forms:'<svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path d="M14 3.5V8h4M9 12h6M9 16h6"/></svg>'};
function dashboard(){const m=appData.dashboard.metrics, events=(appData.events||[]).filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date));let categories=[];if(listData&&listData.date===selectedDate){const counts={};listData.rows.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);categories=Object.keys(counts).map(label=>({label,count:counts[label]}))}const max=Math.max(1,...categories.map(x=>x.count));const bars=categories.length?categories.map((x,i)=>`<div class="bar"><span class="bar-label">${esc(x.label)}</span><div class="bar-track"><div class="bar-fill" style="--w:${Math.round(x.count/max*100)}%;--bar:${['#4b9be8','#aaa0d0','#e8b7d5','#efb99e','#f5d94c'][i%5]};--bar2:#aaa0d0"></div></div><span class="bar-value">${x.count}</span></div>`).join(''):`<div class="emptyline">${listData&&listData.date===selectedDate?'Nenhuma inscrição para este evento.':'Clique em “Atualizar lista” para carregar os dados do evento selecionado.'}</div>`;
return `${pageHead(titles.dashboard,'Dados reais da central, agenda e formulários conectados.','<button class="btn btn-soft" data-action="refresh">↻ Atualizar dados</button>')}<section class="hero"><div class="hero-copy"><div class="hero-kicker">Central de listas e eventos</div><h2>Resumo da operação</h2><p>Acompanhe inscrições, cadastros, agenda e formulários em um só lugar.</p></div><div class="hero-side"><span class="event-pill"><i></i> Próximo evento <b>${events.length?esc(events[0].name||events[0].day)+' · '+fmt(events[0].date):'não cadastrado'}</b></span></div></section><section class="quick-grid"><button class="quick" data-go="exportacoes"><span class="quick-icon">${icons.forms}</span><b>Exportar PDF</b><small>Portaria, leads e DJs</small></button><button class="quick" data-go="eventos"><span class="quick-icon">${icons.people}</span><b>Novo evento</b><small>Atualizar sexta ou sábado</small></button><button class="quick" data-go="djs"><span class="quick-icon">${icons.dj}</span><b>Cadastrar DJ</b><small>Incluir na programação</small></button><button class="quick" data-go="influencers"><span class="quick-icon">${icons.heart}</span><b>Cadastrar influencer</b><small>Gerenciar status</small></button><button class="quick" data-go="formularios"><span class="quick-icon">${icons.forms}</span><b>Formulários</b><small>Ver links e situação</small></button></section><section class="stats">${stat('Inscrições recebidas',m.totalResponses,'Respostas na lista única','#4b91d3','rgba(75,155,232,.14)',icons.people)}${stat('Aceites de novidades',m.marketingConsent,`${m.consentRate}% das inscrições`,'#c77fa5','rgba(232,183,213,.24)',icons.heart)}${stat('DJs cadastrados',m.activeDjs,'Cadastros ativos','#8c82b5','rgba(170,160,208,.2)',icons.dj)}${stat('Formulários ativos',m.activeForms,'Recebendo respostas','#b09a37','rgba(245,217,76,.24)',icons.forms)}</section><section class="grid-main"><article class="card calendar-widget"><div class="card-head"><div><div class="card-title">Próxima agenda</div>${miniCalendar(events)}</div><button class="link-btn" data-go="agenda">Ver agenda ↗</button></div></article><article class="card"><div class="card-head"><div><div class="card-title">Inscrições por lista</div><div class="card-sub">${listData&&listData.date===selectedDate?esc(listData.source):'Selecione evento e atualize os dados'}</div></div></div><div class="form-actions"><select class="filter" data-select-date>${eventOptions()}</select><button class="btn btn-soft" data-action="refresh-list">↻ Atualizar lista</button><button class="btn btn-soft" data-action="view-list">${showListRows?'Ocultar lista':'Ver lista'}</button></div><div class="bars" style="margin-top:14px">${bars}</div>${showListRows&&listData&&listData.date===selectedDate?`<div class="upcoming" style="margin-top:14px;max-height:260px;overflow:auto">${listData.rows.length?listData.rows.map(r=>`<div class="event-row"><div class="event-info"><b>${esc(r.name)}</b><small>${esc(r.type)}</small></div></div>`).join(''):'<div class="emptyline">Nenhuma inscrição para este evento.</div>'}</div>`:''}</article></section><p class="muted-note">Última atualização: ${esc(appData.dashboard.updatedAt||'')}</p>`}
function table(headers,rows){return `<div class="table-card"><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="emptyline">Nenhum cadastro encontrado.</div></td></tr>`}</tbody></table></div></div>`}
function djsPage(){const rows=(appData.djs||[]).map(d=>`<tr><td><strong>${esc(d.name)}</strong></td><td>${d.group==='DJ_SEXTA'?'Sexta-feira':'Sábado'}</td><td>${esc(d.status)}</td><td><button class="btn btn-soft" data-action="toggle" data-group="${esc(d.group)}" data-name="${esc(d.name)}" data-status="${isOpen(d)?'Inativo':'Ativo'}">${isOpen(d)?'Desativar':'Ativar'}</button></td></tr>`).join('');return `${pageHead(titles.djs,'Cadastre DJs por evento e pista; os ativos alimentam a programação.')}<section class="card"><form class="app-form" data-form="dj"><label>Nome completo<input name="name" required autocomplete="name"></label><label>Evento<select name="date" required>${eventOptions()}</select></label><label>Pista<select name="track"><option>Pista SKY</option><option>Pista LAND</option></select></label><button class="btn btn-primary" type="submit">Salvar DJ</button></form></section><div style="height:14px"></div>${table(['DJ','Evento','Status','Ação'],rows)}`}
function influencersPage(){const rows=(appData.influencers||[]).map(d=>`<tr><td><strong>${esc(d.name)}</strong></td><td>${esc(d.profile||'—')}</td><td>${esc(d.status||'Ativo')}</td><td><button class="btn btn-soft" data-action="toggle" data-group="INFLUENCER" data-name="${esc(d.name)}" data-status="${isOpen(d)?'Inativo':'Ativo'}">${isOpen(d)?'Desativar':'Ativar'}</button></td></tr>`).join('');return `${pageHead(titles.influencers,'Gerencie os perfis de influencers e o status que aparece nos formulários.')}<section class="card"><form class="app-form" data-form="influencer"><label>Nome completo<input name="name" required></label><label>Perfil / @<input name="profile" placeholder="@perfil"></label><label>Status<select name="status"><option>Ativo</option><option>Inativo</option></select></label><button class="btn btn-primary" type="submit">Salvar influencer</button></form></section><div style="height:14px"></div>${table(['Nome','Perfil','Status','Ação'],rows)}`}
function eventsPage(){return `${pageHead(titles.eventos,'Defina as datas e nomes dos eventos. A central mantém uma data de sexta e uma de sábado.')}<section class="form-grid">${['Sexta-feira','Sábado'].map((day,i)=>{const e=(appData.events||[]).find(x=>x.day===day)||{};return `<article class="form-card"><div class="form-card-top"><div class="form-name"><span class="form-symbol">▦</span><div><b>${day}</b><small>Evento e data</small></div></div></div><form class="app-form" data-form="event"><input type="hidden" name="day" value="${day}"><label>Nome<input name="name" value="${esc(e.name||'')}" placeholder="Nome do evento"></label><label>Data<input type="date" name="date" value="${esc(e.date||'')}" required></label><button class="btn btn-primary" type="submit">Salvar evento</button></form></article>`}).join('')}</section>`}
function agendaPage(){const ev=(appData.events||[]).filter(e=>e.date);return `${pageHead(titles.agenda,'Agenda conectada às datas cadastradas na planilha.')}<section class="split"><article class="calendar-card"><div class="calendar-head"><strong>Próximos eventos</strong><button class="btn btn-soft" data-go="eventos">Editar datas</button></div><div class="upcoming">${ev.length?ev.map(e=>`<div class="event-row"><div class="date-box"><small>${e.day==='Sexta-feira'?'SEX':'SÁB'}</small><b>${fmt(e.date).slice(0,2)}</b></div><div class="event-info"><b>${esc(e.name||'Evento')}</b><small>${esc(e.day)} · ${fmt(e.date)}</small></div><span class="status">Agendado</span></div>`).join(''):'<div class="emptyline">Nenhum evento cadastrado.</div>'}</div></article><article class="card"><div class="card-title">Regras de abertura</div><p class="card-sub">Formulários unificados seguem as regras configuradas.</p><div class="schedule-line"><span>Abertura semanal</span><b>Terça-feira · 20h</b></div><div class="schedule-line"><span>Encerramento</span><b>Dia do evento · 19h</b></div><div class="schedule-line"><span>Aniversário</span><b>Dia do evento · 13h</b></div></article></section>`}
function programPage(){const rows=(appData.schedule||[]).filter(r=>!selectedDate||fmt(r.date)===fmt(selectedDate)).map(r=>`<tr><td>${esc(r.start||'')}</td><td><strong>${esc(r.dj)}</strong></td><td>${esc(r.track||'')}</td><td>${esc(r.end||'')}</td></tr>`).join('');return `${pageHead(titles.programacao,'Programação automática por evento e pista.')}<div class="table-tools"><select class="filter" data-select-date>${eventOptions()}</select><button class="btn btn-soft" data-action="refresh">↻ Atualizar</button></div>${table(['Início','DJ','Pista','Fim'],rows)}`}
function formsPage(){const forms=appData.forms||[];return `${pageHead(titles.formularios,'Acompanhe os links e o estado real de recebimento no Google Forms.','<button class="btn btn-soft" data-action="forms-refresh">↻ Atualizar formulários</button>')}<section class="form-grid">${forms.length?forms.map(f=>`<article class="form-card"><div class="form-card-top"><div class="form-name"><span class="form-symbol">☷</span><div><b>${esc(f.title)}</b><small>${esc(f.key)}</small></div></div><span class="form-status ${f.open?'':'closed'}"><i></i>${f.open?'Recebendo respostas':'Fechado'}</span></div><div class="schedule-line"><span>Link público</span><b>${f.url?'<a target="_blank" rel="noopener" href="'+esc(f.url)+'">Abrir formulário ↗</a>':'Link não configurado'}</b></div><div class="form-foot"><span>Estado consultado no Google Forms</span>${f.editUrl?`<a target="_blank" rel="noopener" href="${esc(f.editUrl)}">Editar</a>`:''}</div></article>`).join(''):'<div class="emptyline">Nenhum formulário configurado nas propriedades do Apps Script.</div>'}</section>`}
function exportPage(){return `${pageHead(titles.exportacoes,'Gere arquivos PDF no timbrado Verdant.')}<section class="export-grid">${[['Portaria do evento','Lista operacional separada pelas regras do evento','export-portaria'],['Leads com aceite','Contatos que autorizaram receber novidades','export-leads'],['DJs ativos','Relação de DJs ativos cadastrados','export-djs']].map(x=>`<article class="export-card"><div><span class="export-mark">▤</span><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn btn-primary" data-action="${x[2]}">Gerar PDF</button></div><div class="paper"><div class="paper-caption">VERDANT CWB</div><div class="paper-line"></div><div class="paper-line short"></div><div class="paper-line"></div><div class="paper-line"></div></div></article>`).join('')}</section><section class="card" style="margin-top:14px"><div class="card-head"><div><div class="card-title">Portaria</div><div class="card-sub">Escolha o evento para exportar.</div></div></div><select class="filter" data-select-date>${eventOptions()}</select></section>`}
function settingsPage(){return `${pageHead(titles.configuracoes,'Regras operacionais e cadastros ativos.')}<section class="settings-grid"><article class="setting"><h3>Liberação dos formulários</h3><p>Terça-feira às 20h.</p><span class="pill">Configurado</span></article><article class="setting"><h3>Encerramento</h3><p>Às 19h no dia do evento selecionado.</p><span class="pill">Configurado</span></article><article class="setting"><h3>Consentimento de novidades</h3><p>O aceite é registrado para contatos que autorizam comunicações.</p><span class="pill">Ativo</span></article><article class="setting"><h3>Sincronização</h3><p>Atualiza opções e janelas dos formulários conforme agenda e cadastros.</p><button class="btn btn-soft" data-action="forms-refresh">Sincronizar agora</button></article></section>`}
function render(){if(!appData)return;const f={dashboard,djs:djsPage,influencers:influencersPage,eventos:eventsPage,agenda:agendaPage,programacao:programPage,formularios:formsPage,exportacoes:exportPage,configuracoes:settingsPage}[route]||dashboard;$('#content').innerHTML=f();$('#content').classList.add('ready');$('#crumb').textContent=titles[route]||titles.dashboard;document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===route));document.querySelectorAll('.nav-group').forEach(b=>{const target=b.dataset.group;const open=(target==='cadastros'&&['djs','influencers'].includes(route))||(target==='eventos'&&['eventos','agenda','programacao'].includes(route))||(target==='formularios'&&route==='formularios');b.setAttribute('aria-expanded',String(open));const sub=$('#group-'+target);if(sub)sub.classList.toggle('open',open)})}
function navigate(p){route=p in titles?p:'dashboard';render();toggleSidebar(false);window.scrollTo({top:0,behavior:'smooth'})}
function toggleSidebar(force){const s=$('#sidebar'),show=typeof force==='boolean'?force:!s.classList.contains('show');s.classList.toggle('show',show);$('#shade').classList.toggle('show',show);document.querySelectorAll('.menu-open').forEach(b=>b.setAttribute('aria-expanded',String(show)))}
function downloadPdf(pdf){const a=document.createElement('a');a.href='data:'+pdf.mimeType+';base64,'+pdf.data;a.download=pdf.filename;document.body.appendChild(a);a.click();a.remove();toast(`PDF gerado · ${pdf.count} registros`)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}const group=e.target.closest('.nav-group');if(group){const sub=$('#group-'+group.dataset.group);const open=group.getAttribute('aria-expanded')!=='true';group.setAttribute('aria-expanded',String(open));sub?.classList.toggle('open',open);return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='refresh'){b.disabled=true;refresh();setTimeout(()=>b.disabled=false,900)}if(action==='refresh-list'){selectedDate=document.querySelector('[data-select-date]')?.value||selectedDate;if(!selectedDate){toast('Cadastre a data do evento antes de atualizar a lista.');return}b.disabled=true;call('getEventList',[selectedDate],d=>{listData={...d,date:selectedDate};showListRows=true;render();toast('Lista atualizada')})}if(action==='view-list'){if(!listData||listData.date!==selectedDate){toast('Clique em “Atualizar lista” para carregar as inscrições.');return}showListRows=!showListRows;render()}if(action==='forms-refresh'){b.disabled=true;call('refreshVerdantForms',[],d=>{appData=d;render();toast('Formulários sincronizados')})}if(action==='toggle'){call('setVerdantOptionStatus',[b.dataset.group,b.dataset.name,b.dataset.status],d=>{appData=d;render();toast('Status atualizado')})}if(action==='export-portaria')call('exportEventPdf',[selectedDate||document.querySelector('[data-select-date]')?.value],downloadPdf);if(action==='export-leads')call('exportConsentLeadsPdf',[],downloadPdf);if(action==='export-djs')call('exportActiveDjsPdf',[],downloadPdf)});
document.addEventListener('change',e=>{if(e.target.matches('[data-select-date]')){selectedDate=e.target.value;if(route==='programacao')render()}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const d=Object.fromEntries(new FormData(form).entries());const submit=form.querySelector('[type=submit]');if(submit){submit.disabled=true;submit.dataset.busy='1'}const finish=data=>{appData=data;render();toast('Cadastro salvo na central')};const fail=err=>{toast(err?.message||'Não foi possível salvar');if(submit)submit.disabled=false};const runner=google.script.run.withSuccessHandler(finish).withFailureHandler(fail);if(form.dataset.form==='dj')runner.saveVerdantDj(d.name,d.date,d.track);if(form.dataset.form==='influencer')runner.saveVerdantInfluencer(d.name,d.profile,d.status);if(form.dataset.form==='event')runner.saveVerdantEvent(d.day,d.date,d.name)});
window.navigate=navigate;window.toggleSidebar=toggleSidebar;window.toast=toast;refresh(false);
