<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11121d">
  <meta name="description" content="Acesse os eventos da Verdant Curitiba no Facebook.">
  <title>Eventos | Verdant</title>
  <link rel="icon" href="/assets/verdant-logo-branca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/legal-pages.css">
  <style>
    .events-intro {
      max-width: 590px;
      margin: 16px auto 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      text-align: center;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .event-card {
      --event-color: #59c9ed;
      min-width: 0;
    }

    .event-card:nth-child(2) { --event-color: #b889f3; }
    .event-card:nth-child(3) { --event-color: #ed7eb8; }
    .event-card:nth-child(4) { --event-color: #f0ae62; }
    .event-card:nth-child(5) { --event-color: #76d6a8; }

    .event-cover {
      display: flex;
      overflow: hidden;
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--event-color) 34%, transparent);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .event-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .event-cover-placeholder {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,232,70,.32), transparent 38%),
        linear-gradient(145deg, #173b36, #0b1722 72%);
      color: #fff;
      font-size: clamp(13px, 2vw, 20px);
      font-weight: 800;
      letter-spacing: .09em;
      text-align: center;
      text-shadow: 0 2px 14px #0009;
    }

    .event-cover-placeholder span:first-child { font-size: 1.8em; }

    .event-cover:hover {
      transform: translateY(-3px);
      border-color: var(--event-color);
      box-shadow: 0 18px 36px rgba(0,0,0,.28), 0 0 22px color-mix(in srgb, var(--event-color) 20%, transparent);
    }

    body.light .event-cover { box-shadow: 0 12px 28px rgba(41,55,79,.14); }
    .event-cover:focus-visible { outline: 3px solid #8bdcff; outline-offset: 3px; }

    @media (max-width: 600px) {
      .events-intro { margin: 13px auto 22px; font-size: 13px; }
      .events-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .event-cover { border-radius: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .event-cover:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="topbar">
        <img class="brand" src="/assets/verdant-logo-branca.png" data-dark-logo="/assets/verdant-logo-branca.png" data-light-logo="/assets/verdant-logo-preta.png" alt="Verdant Curitiba">
        <button class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">☼</span><span>Tema claro</span></button>
      </div>
      <p class="language"><span aria-hidden="true">文</span> &nbsp;PT-BR</p>
      <div class="spectrum" aria-hidden="true"></div>
    </header>
    <main class="document">
      <h1>Eventos da Verdant</h1>
      <p class="events-intro">Encontre seu próximo rolê. Escolha um evento para ver a programação e mais informações no Facebook.</p>
      <section class="events-grid" aria-label="Eventos da Verdant">
        <article class="event-card">
          <a class="event-cover" href="https://www.facebook.com/share/1M6s8FcqSv/" target="_blank" rel="noopener noreferrer" aria-label="Abrir evento Start Me Up no Facebook">
            <img src="/assets/start-me-up-pop-funk.jpg" alt="Capa do evento Start Me Up">
          </a>
        </article>
        <article class="event-card">
          <a class="event-cover" href="https://www.facebook.com/share/1DZD9sqRaU/" target="_blank" rel="noopener noreferrer" aria-label="Abrir evento Frenétika no Facebook">
            <img src="/assets/frenetika-land-2026.jpg" alt="Capa do evento Frenétika">
          </a>
        </article>
        <article class="event-card">
          <a class="event-cover" href="https://www.facebook.com/share/1HqZ1DJrMm/" target="_blank" rel="noopener noreferrer" aria-label="Abrir evento Terashima Ascension no Facebook">
            <img src="/assets/terashima-ascension-main-2026.jpg" alt="Capa do evento Terashima Ascension">
          </a>
        </article>
        <article class="event-card">
          <a class="event-cover" href="https://www.facebook.com/share/1BpoHsHqbW/" target="_blank" rel="noopener noreferrer" aria-label="Abrir evento Ressaka no Facebook">
            <img src="/assets/ressaka-poster.jpg" alt="Capa do evento Ressaka">
          </a>
        </article>
        <article class="event-card">
          <a class="event-cover" href="https://www.facebook.com/share/19Zu8bRN9P/" target="_blank" rel="noopener noreferrer" aria-label="Abrir evento GOSTOSO no Facebook">
            <span class="event-cover-placeholder" role="img" aria-label="GOSTOSO, sábado 24 de outubro">
              <span aria-hidden="true">🍌</span>
              <span>GOSTOSO</span>
              <span>SÁBADO · 24 OUT</span>
            </span>
          </a>
        </article>
      </section>
    </main>
    <nav class="legal" aria-label="Informações legais">
      <a href="/politica-de-privacidade.html">Política de Privacidade</a>
      <a href="/termos-de-uso.html">Termos de Uso</a>
      <a href="/exclusao-de-dados.html">Exclusão de Dados</a>
    </nav>
    <div class="credit"><span>Desenvolvido por</span><img src="/assets/scope-connect-logo.png" alt="Scope Connect"></div>
  </div>
  <script src="/assets/legal-pages.js"></script>
</body>
</html>
